spring.application.name=demo
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/smartlink
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=<your_db_password>

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

Gemini_key=<your_gemini_api_key>

# JWT
jwt.secret=very_secret_long_key_replace_this_make_it_very_long_and_secure
jwt.expiration-ms=86400000

# Logging
logging.level.org.hibernate.SQL=DEBUG
server.error.include-message=always

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=<your_google_client_id>
spring.security.oauth2.client.registration.google.client-secret=<your_google_client_secret>
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Frontend & CORS configuration and backend ;)
app.frontend.base-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5175,http://localhost:5173
app.backend.base-url=http://localhost:8080


# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<your_gmail_address>
spring.mail.password=<your_gmail_app_password>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Redis disabled - start docker-compose if needed
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0

